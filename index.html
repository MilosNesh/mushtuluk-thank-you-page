
<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uspešno prijavljivanje - Mushtuluk</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #18181b;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 48px 36px;
      background: #ffffff;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      border-radius: 50%;
      font-size: 30px;
    }

    .logo {
      margin-bottom: 36px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 25px;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 30px;
      color: #71717a;
      font-size: 15px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 15px 32px;
      background: #18181b;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: #3f3f46;
    }

    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #e4e4e7;
      color: #a1a1aa;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 24px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">Mushtuluk</div>

    <div class="success-icon">
      ✓
    </div>

    <h1>Uspešno si prijavljen!</h1>

    <p class="description">
      Hvala ti što si deo Mushtuluk zajednice.
      Drago nam je što si ponovo sa nama.
      Uživaj u korišćenju aplikacije!
    </p>

    <a href="/" class="button">
      Nastavi dalje
    </a>

    <div class="footer">
      © Mushtuluk. Sva prava zadržana.
    </div>

  </main>

</body>
</html>
